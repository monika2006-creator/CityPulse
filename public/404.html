<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070b14" />
    <meta name="description" content="The page you requested could not be found on CityPulse." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found | CityPulse</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #070b14; color: #f8fafc; font-family: Manrope, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
      main { max-width: 440px; }
      .mark { width: 56px; height: 56px; margin: 0 auto 24px; display: grid; place-items: center; border: 1px solid #164e63; border-radius: 16px; background: #082f49; color: #67e8f9; font-size: 25px; }
      .code { color: #67e8f9; font: 700 14px ui-monospace, monospace; letter-spacing: .2em; }
      h1 { margin: 8px 0; font-size: clamp(24px, 6vw, 32px); }
      p { color: #94a3b8; font-size: 14px; line-height: 1.7; }
      a { display: inline-block; margin-top: 14px; border-radius: 9px; background: #22d3ee; padding: 11px 16px; color: #082f49; font-size: 14px; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #a5f3fc; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">⌁</div>
      <div class="code">404</div>
      <h1>Page not found</h1>
      <p>That CityPulse page doesn’t exist. Head back to the overview to continue.</p>
      <a href="/">Back to CityPulse</a>
    </main>
  </body>
</html>
